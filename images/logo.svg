<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <defs>
    <linearGradient id="brandBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e575" />
      <stop offset="100%" stop-color="#00c853" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00c853" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 角丸スクエア背景 -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#brandBgGrad)" filter="url(#shadow)" />

  <!-- 中央の大きなメインスパークル星（白ストローク線画） -->
  <path d="M 50 25 C 50 39 39 50 25 50 C 39 50 50 61 50 75 C 50 61 61 50 75 50 C 61 50 50 39 50 25 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 右上のプラスマーク (+) -->
  <path d="M 68 28 L 68 18 M 63 23 L 73 23" 
        stroke="#ffffff" 
        stroke-width="6.5" 
        stroke-linecap="round" />

  <!-- 左下の丸ドット (〇) -->
  <circle cx="28" cy="71" r="5" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" />
</svg>
